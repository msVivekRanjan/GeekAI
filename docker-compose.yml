services:
  postgres:
    image: postgres:16
    container_name: geekai-postgres
    # All database credentials come from the root .env file (never committed).
    # The operator must create .env from .env.example before starting compose.
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geekai}
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - geekai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geekai} -d ${POSTGRES_DB:-geekai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geekai-backend
    # Secrets are supplied at runtime from the root .env file. Generate a
    # JWT secret with: python -c "import secrets; print(secrets.token_urlsafe(64))"
    env_file:
      - .env
    environment:
      # DATABASE_URL is supplied by the root .env via env_file. Under Compose
      # its host MUST be `postgres` (not `localhost`) — see .env.example.
      ACTIVE_EVENT_CODE: ${ACTIVE_EVENT_CODE:-oas-2026}
      QR_ISSUER: ${QR_ISSUER:-geekai-hub-01}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - geekai-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geekai-frontend
    ports:
      - "5173:80"
    networks:
      - geekai-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  geekai-network:
    driver: bridge
    name: geekai-network

volumes:
  postgres_data:
